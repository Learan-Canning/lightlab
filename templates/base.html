{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}LightLab{% endblock %}</title>

  <!-- Fonts & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,500,0,0">

  <!-- Tailwind config (keeps templates consistent) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            llbg: "#f9f8fc",
            lltext: "#1f1b29",
            llprimary: "#a987d8",
            llprimaryDark: "#926fc8",
            llsoft: "#efe8f8",
            llcard: "#ffffff"
          },
          fontFamily: {
            heading: ["Cormorant Garamond", "serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Project CSS + favicons -->
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'favicon/favicon_1.ico' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon/icon-192_1.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'favicon/icon-512_1.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">

  {% block head %}{% endblock %}
</head>
<body class="bg-llbg text-lltext font-body antialiased">
  <!-- Top header -->
  <header class="sticky top-0 z-50 backdrop-blur bg-llbg/90 border-b border-[#e8e0f2]">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 lg:px-10 py-4 grid grid-cols-[auto_1fr_auto] items-center gap-4">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="md:hidden p-2 rounded-lg border border-[#e8e0f2]" aria-label="Open menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <a href="/" class="inline-flex items-center" aria-label="LightLab home"><img src="{% static 'img/Lightlabnav.webp' %}" alt="LightLab" class="h-10 sm:h-11 w-auto object-contain" /></a>
      </div>

      <nav class="hidden md:flex items-center justify-center gap-8 text-sm font-medium">
        <a href="/" class="hover:text-llprimary">Home</a>
        <a href="/shop/" class="hover:text-llprimary">Shop</a>
        <a href="/certificates/" class="hover:text-llprimary">Education Hub</a>
        <a href="/about/" class="hover:text-llprimary">About</a>
        <a href="/faq/" class="hover:text-llprimary">FAQ</a>
        <a href="/contact/" class="hover:text-llprimary">Contact</a>
      </nav>

      <div class="flex justify-end">
        <a href="/cart/" class="p-2 rounded-lg border border-[#e8e0f2]" aria-label="Go to cart">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </a>
      </div>
    </div>

    <!-- Mobile nav -->
    <nav id="mobileMenu" class="md:hidden border-t border-[#e8e0f2] bg-llbg hidden">
      <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-3 text-sm font-medium">
        <a href="/" class="hover:text-llprimary">Home</a>
        <a href="/shop" class="text-llprimary font-semibold">Shop</a>
        <a href="/certificates" class="hover:text-llprimary">Education Hub</a>
        <a href="/about" class="hover:text-llprimary">About</a>
        <a href="/faq" class="hover:text-llprimary">FAQ</a>
        <a href="/contact" class="hover:text-llprimary">Contact</a>
      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-[#e8e0f2] mt-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-sm text-[#756d86]">
      © LightLab. All rights reserved.
    </div>
  </footer>

  <script src="{% static 'js/site.js' %}" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
